<div class="container-fluid"><h2>Provider</h2><div *ngIf="loading"><mat-spinner diameter="32"></mat-spinner></div><mat-card *ngFor="let p of providers" class="mb-2"><mat-card-header><mat-card-title>{{p.name}}</mat-card-title></mat-card-header><mat-card-content>{{p.model}} - <mat-chip [color]="p.health==='healthy'?'primary':'warn'">{{p.health}}</mat-chip></mat-card-content></mat-card></div>
