<div class="dv-page">
  <div class="dv-page-bar">
    <div>
      <div class="dv-page-title">Progetti</div>
      <div class="dv-page-sub">{{items.length}} progetti collegati al workspace</div>
    </div>
  </div>

  <div *ngIf="loading" class="dv-loading"><mat-spinner [diameter]="20"></mat-spinner> Caricamento...</div>
  <div *ngIf="error" class="dv-error">{{error}}</div>

  <table class="dv-table" *ngIf="!loading && !error && items.length > 0">
    <thead>
      <tr>
        <th>NOME</th>
        <th>PATH</th>
        <th>DESCRIZIONE</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td class="td-name">{{item.name || item.id}}</td>
        <td><span class="mono">{{item.rootPath}}</span></td>
        <td class="td-desc">{{item.description || '—'}}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="items.length === 0 && !loading" class="dv-empty">
    <mat-icon>folder</mat-icon>
    <p>Nessun progetto configurato</p>
    <small>Aggiungi progetti a workspace/context/project.json</small>
  </div>
</div>
