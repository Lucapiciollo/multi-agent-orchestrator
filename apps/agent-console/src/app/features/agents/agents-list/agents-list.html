<div class="dv-page">
  <div class="dv-page-bar">
    <div>
      <div class="dv-page-title">Agenti</div>
      <div class="dv-page-sub">{{items.length}} agenti registrati</div>
    </div>
  </div>

  <div *ngIf="loading" class="dv-loading">
    <mat-spinner [diameter]="20"></mat-spinner> Caricamento...
  </div>
  <div *ngIf="error" class="dv-error">{{error}}</div>

  <table class="dv-table" *ngIf="!loading && !error && items.length > 0">
    <thead>
      <tr>
        <th>ID AGENTE</th>
        <th>DESCRIZIONE</th>
        <th>PRIORITÀ</th>
        <th>PROVIDER</th>
        <th>SKILL</th>
        <th>WORKFLOW</th>
        <th>TAG</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td><span class="mono">{{item.id}}</span></td>
        <td class="td-desc">{{item.description}}</td>
        <td class="td-priority">
          <span class="priority-badge" [class.p-high]="item.priority >= 90" [class.p-mid]="item.priority >= 60 && item.priority < 90" [class.p-low]="item.priority < 60">
            {{item.priority}}
          </span>
        </td>
        <td>
          <span class="dv-badge blue"    *ngIf="item.provider?.type === 'copilot'">copilot</span>
          <span class="dv-badge ok"      *ngIf="item.provider?.type === 'ollama'">ollama</span>
          <span class="dv-badge neutral" *ngIf="item.provider?.type === 'mock'">mock</span>
          <span class="dv-badge neutral" *ngIf="!item.provider?.type">N/A</span>
        </td>
        <td class="td-skills">
          <span *ngFor="let s of item.skills" class="skill-tag">{{s}}</span>
          <span class="td-none" *ngIf="!item.skills?.length">—</span>
        </td>
        <td class="td-workflows">
          <span *ngFor="let w of item.usedByWorkflows" class="workflow-tag">{{w}}</span>
          <span class="td-none" *ngIf="!item.usedByWorkflows?.length">—</span>
        </td>
        <td class="td-tags">
          <span *ngFor="let t of item.tags" class="tag-chip">{{t}}</span>
          <span class="td-none" *ngIf="!item.tags?.length">—</span>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="items.length === 0 && !loading" class="dv-empty">
    <mat-icon>smart_toy</mat-icon>
    <p>Nessun agente trovato</p>
  </div>
</div>
