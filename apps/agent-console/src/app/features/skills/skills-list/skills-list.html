<div class="dv-page">
  <div class="dv-page-bar">
    <div>
      <div class="dv-page-title">Skill</div>
      <div class="dv-page-sub">{{items.length}} skill disponibili</div>
    </div>
  </div>

  <div *ngIf="loading" class="dv-loading"><mat-spinner [diameter]="20"></mat-spinner> Caricamento...</div>
  <div *ngIf="error" class="dv-error">{{error}}</div>

  <table class="dv-table" *ngIf="!loading && !error && items.length > 0">
    <thead>
      <tr>
        <th>ID SKILL</th>
        <th>NOME</th>
        <th>DESCRIZIONE</th>
        <th>AGENTI</th>
        <th>WORKFLOW</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td><span class="mono">{{item.id}}</span></td>
        <td class="td-name">{{item.name}}</td>
        <td class="td-desc">{{item.description}}</td>
        <td class="td-agents">
          <span *ngFor="let a of item.usedByAgents" class="agent-tag">{{a}}</span>
          <span class="td-none" *ngIf="!item.usedByAgents?.length">—</span>
        </td>
        <td class="td-workflows">
          <span *ngFor="let w of item.usedByWorkflows" class="workflow-tag">{{w}}</span>
          <span class="td-none" *ngIf="!item.usedByWorkflows?.length">—</span>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="items.length === 0 && !loading" class="dv-empty">
    <mat-icon>bolt</mat-icon><p>Nessuna skill trovata</p>
  </div>
</div>
