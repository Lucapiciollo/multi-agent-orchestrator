<header class="dv-header">
  <div class="dv-header-left">
    <span class="dv-header-title">{{title}}</span>
  </div>
  <div class="dv-header-right">
    <div class="dv-provider-chips">
      <div class="dv-pchip" [class.ok]="copilotOk" [class.ko]="!copilotOk">
        <span class="dv-pchip-dot"></span>Copilot
      </div>
      <div class="dv-pchip" [class.ok]="ollamaOk" [class.ko]="!ollamaOk">
        <span class="dv-pchip-dot"></span>Ollama
      </div>
    </div>
  </div>
</header>
