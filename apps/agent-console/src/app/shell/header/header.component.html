<div class="dv-header">
  <div class="dv-header-left">
    <span class="dv-header-title">{{ title }}</span>
  </div>
  <div class="dv-header-right">
    <div class="dv-pchip" [class.ok]="copilotClass === 'status-ok'" [class.ko]="copilotClass === 'status-err'" [matTooltip]="'Copilot: ' + copilotStatus">
      <span class="dv-pchip-dot"></span><span>Copilot</span>
    </div>
    <div class="dv-pchip" [class.ok]="ollamaClass === 'status-ok'" [class.ko]="ollamaClass === 'status-err'" [matTooltip]="'Ollama: ' + ollamaStatus">
      <span class="dv-pchip-dot"></span><span>Ollama</span>
    </div>
  </div>
</div>
