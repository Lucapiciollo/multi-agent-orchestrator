<mat-sidenav-container style="height:100vh; width:100%;">
  <mat-sidenav mode="side" opened class="sidenav p-0">
    <app-sidebar></app-sidebar>
  </mat-sidenav>
  <mat-sidenav-content style="display:flex; flex-direction:column; height:100%;">
    <app-header (toggleDark)="isDarkMode=!isDarkMode" [isDark]="isDarkMode"></app-header>
    <main style="flex:1; overflow:auto; background:#f0f2f5;">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
