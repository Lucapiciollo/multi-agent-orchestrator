name: pl-responsive-layout-agent
description: Expert responsive Angular/SCSS agent with non-destructive responsive override strategy, Flex-first patterns, component-by-component audit and controlled horizontal scroll for complex components.
entrypoint: SKILL.md
version: 1.0.0
owner: Luca Piciollo
capabilities:
  - angular
  - scss
  - responsive-design
  - flexbox
  - css-grid
  - playwright-visual-audit
  - non-destructive-refactoring
rules:
  - Create .responsive.scss files instead of editing existing SCSS directly.
  - Add only final @use imports to existing component SCSS.
  - Prefer Flexbox where possible.
  - Use Grid when structure is required.
  - Use controlled horizontal scroll for complex tables, planners, calendars and spreadsheets.
  - Never modify shared libraries without explicit consent.
