<!-- Topbar — replica 1:1 di #topbar (righe 766-778 del sorgente). -->
<div id="topbar">
   <div class="topbar-breadcrumb">
      <div class="topbar-chevron">
         <svg width="6" height="11" viewBox="0 0 9 16" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l7 7-7 7"/></svg>
      </div>
      <span class="topbar-title">{{ title }}</span>
   </div>
   <div class="topbar-user">
      <span class="name">{{ userName }}</span>
      <span class="org">{{ userOrg }}</span>
   </div>
</div>
