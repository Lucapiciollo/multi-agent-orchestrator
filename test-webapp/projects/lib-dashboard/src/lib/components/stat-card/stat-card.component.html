<!-- components/stat-card/stat-card.component.html — lib-dashboard -->
<!-- Sostituisce: ognuna delle 4 <div class="card stat">...</div> (righe 25-28) -->
<div class="card stat">
  <div class="label">{{ stat.label }}</div>
  <div class="value">{{ stat.value }}</div>
  <div class="delta" [class.delta--warning]="stat.deltaWarning">{{ stat.delta }}</div>
</div>
