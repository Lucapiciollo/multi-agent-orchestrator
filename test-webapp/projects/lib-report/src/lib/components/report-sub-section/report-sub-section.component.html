<div class="sub-section">
  <div class="ts-sub-header">
    <div class="ts-header-left">
      <span class="ts-section-name">{{ subSection.label }}</span>
      <div class="ts-tabs">
        <button type="button" class="ts-tab" [class.active]="activeTab === 'preimpostati'" (click)="activeTab = 'preimpostati'">Report preimpostati</button>
        <button type="button" class="ts-tab" [class.active]="activeTab === 'miei'" (click)="activeTab = 'miei'">
          I miei report
          <span class="ts-tab-badge">{{ myReports.length }}</span>
        </button>
      </div>
    </div>
    <button type="button" class="btn btn-outline-primary" (click)="onOpenCustom()">
      <svg viewBox="0 0 24 24" style="width:11px;height:11px;flex-shrink:0"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      Personalizza nuovo report
    </button>
  </div>

  @if (activeTab === 'preimpostati') {
    <div class="cards-grid">
      @for (preset of subSection.presets; track preset.label) {
        <lib-report-preset-card [preset]="preset" (select)="onSelectPreset($event)"></lib-report-preset-card>
      }
    </div>
  }

  @if (activeTab === 'miei') {
    <lib-report-my-reports-panel
      [reports]="myReports"
      (open)="onOpenSavedReport($event)"
      (delete)="onDeleteSavedReport($event)"
    ></lib-report-my-reports-panel>
  }
</div>
